version: 1
frontend:
    phases:
        preBuild:
            commands:
                - nvm install
                - nvm use

                # Configure npm auth for the @callimacus scope (public packages on npmjs)
                - echo "@callimacus:registry=https://registry.npmjs.org/" > .npmrc

                # Install dependencies
                - npm ci --cache .npm --prefer-offline
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - '**/*'
    cache:
        paths:
            - '.npm/**/*'
